<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nápojový lístek | ALEXA Exclusive Night Club</title>
    <meta
      name="description"
      content="Editovatelný online nápojový lístek ALEXA Exclusive Night Club pro QR kód."
    >
    <meta name="theme-color" content="#17141a">
    <meta property="og:title" content="Nápojový lístek | ALEXA Exclusive Night Club">
    <meta property="og:description" content="Aktuální nápojový lístek ALEXA Exclusive Night Club.">
    <meta property="og:type" content="website">
    <link rel="icon" href="./assets/logo-alexa.png">
    <link rel="stylesheet" href="./styles.css">
    <script defer src="./menu-data.js"></script>
    <script defer src="./app.js"></script>
  </head>
  <body>
    <header class="site-header" id="top">
      <div class="header-ornament" aria-hidden="true"></div>
      <div class="shell header-layout">
        <a class="brand" href="#top" aria-label="ALEXA Exclusive Night Club">
          <img src="./assets/logo-alexa.png" alt="ALEXA Exclusive Night Club">
        </a>

        <div class="header-copy">
          <h1>Nápojový lístek</h1>
          <p>Doprava: <a href="tel:+420607802629">+420 607 802 629</a></p>
        </div>
      </div>
    </header>

    <main>
      <nav class="menu-toolbar" aria-label="Sekce nápojového lístku">
        <div class="shell toolbar-layout">
          <div class="tabs" id="group-tabs"></div>
          <label class="search">
            <span aria-hidden="true">
              <svg viewBox="0 0 24 24" role="img">
                <path d="m21 21-4.35-4.35m1.35-5.65a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"></path>
              </svg>
            </span>
            <input id="menu-search" type="search" autocomplete="off" placeholder="Hledat">
          </label>
        </div>
      </nav>

      <section class="shell intro-row" aria-label="Kontakt a výhoda">
        <div class="promo-line">
          <strong>Zavolejte a užijte si zvýhodněné ceny</strong>
          <span>+ welcome drink ZDARMA</span>
        </div>
        <a class="call-button" href="tel:+420607802629">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.2 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.35 1.9.67 2.8a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.32 1.84.54 2.8.67A2 2 0 0 1 22 16.92Z"></path>
          </svg>
          Zavolat
        </a>
      </section>

      <div class="menu-stage">
        <div class="shell">
          <div id="menu-root" class="menu-root" aria-live="polite"></div>
          <p id="empty-state" class="empty-state" hidden>Nic jsme nenašli.</p>
        </div>
      </div>

      <section class="contact-band" aria-label="Kontakt">
        <div class="shell contact-layout">
          <div>
            <h2>Kontakt</h2>
            <address id="contact-address"></address>
          </div>
          <div class="contact-actions">
            <a href="tel:+420775345706">+420 775 345 706</a>
            <a href="tel:+420607802629">+420 607 802 629</a>
            <a href="https://alexaclub.cz">alexaclub.cz</a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
